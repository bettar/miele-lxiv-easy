# To build latest GitHub app
MINUS_STD=gnu++20
DEPL_TARG=10.15

DCMTK_MAJOR=3
DCMTK_MINOR=7
DCMTK_BUILD=0
DCMTK_VERSION=$DCMTK_MAJOR.$DCMTK_MINOR.$DCMTK_BUILD
#DCMTK_OPTIONS="-D DCMTK_WITH_OPENSSL=ON -D DCMTK_WITH_ICONV=ON"
DCMTK_OPTIONS="-D DCMTK_WITH_OPENSSL=ON -D DCMTK_WITH_ICONV=ON -D WITH_OPENSSLINC=ON -D OPENSSL_VERSION_CHECK=ON"
DCMTK_CXX_FLAGS=FOR_MIELE_LXIV

#-------------------------------------------------------------------------------
ICONV_VERSION=1.18

#-------------------------------------------------------------------------------
#OPENSSL_VERSION=1.1.0j

OPENSSL_MAJOR=3
OPENSSL_MINOR=6
OPENSSL_REVISION=0

OPENSSL_VERSION=$OPENSSL_MAJOR.$OPENSSL_MINOR.${OPENSSL_REVISION}${OPENSSL_PATCH}

#-------------------------------------------------------------------------------

PNG_VERSION=1.6.51

TIFF_VERSION=4.7.1

#ZLIB_VERSION=1.3.1
ZLIB_VERSION=1.3.2

XML2_VERSION=2.15.1

#-------------------------------------------------------------------------------
